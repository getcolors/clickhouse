---
<% if clickhouse-backup-bucket %>
- name: Stop native backups before retiring storage
  hosts: clickhouse[0]
  become: true
  gather_facts: false
  tasks:
    - name: Inspect installed backup units
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ item }}"
      loop:
        - clickhouse-backup.timer
        - clickhouse-backup.service
      register: backup_units
    - name: Stop the backup timer and any running backup
      ansible.builtin.systemd:
        name: "{{ item.item }}"
        state: stopped
        enabled: false
      loop: "{{ backup_units.results }}"
      when: item.stat.exists
<% endif %>
- name: Disconnect local WireGuard before destroying servers
  hosts: local
  become: true
  tasks:
    - name: Bring down the managed interface when present
      ansible.builtin.command: wg-quick down wg-clickhouse
      environment:
        PATH: "{{ lookup('env','PATH') }}"
      register: wg_down
      failed_when: false
      changed_when: wg_down.rc == 0
    - name: Remove managed WireGuard configuration
      ansible.builtin.file:
        path: /etc/wireguard/wg-clickhouse.conf
        state: absent
