name: Test and Tag

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: latest
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v6
      - name: Green tests and goldens
        run: cd green && bb test && bb golden
      - name: Red tests and typecheck
        run: cd red && bun install && bun test && bun run typecheck
      - name: Blue tests
        run: cd blue && uv sync && uv run pytest -q
      - name: Byte parity
        run: ./scripts/parity.sh
      - name: Launcher resolution
        run: ./scripts/launcher.sh

  tag:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create immutable revision tag
        run: |
          count=$(git rev-list --count HEAD)
          tag="1.0.${count}"
          local_sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote --tags origin "refs/tags/${tag}" | awk '{print $1}')
          if [ -n "$remote_sha" ]; then
            [ "$remote_sha" = "$local_sha" ] && exit 0
            echo "::error::Refusing to move existing tag ${tag}"; exit 1
          fi
          git tag "$tag"
          git push origin "$tag"
