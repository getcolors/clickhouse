---
- name: Create the workstation WireGuard identity
  hosts: local
  gather_facts: false
  become: false
  vars:
    wg_state_dir: "{{ lookup('env', 'HOME') }}/.local/state/clickhouse/clickhouse-fixture"
  tasks:
    - name: Create private local state directory
      ansible.builtin.file:
        path: "{{ wg_state_dir }}"
        state: directory
        mode: "0700"
    - name: Generate the retained local private key
      ansible.builtin.shell: |
        set -o pipefail
        umask 077
        wg genkey > "{{ wg_state_dir }}/private.key"
      args:
        executable: /bin/bash
        creates: "{{ wg_state_dir }}/private.key"
      no_log: true
    - name: Derive the local public key
      ansible.builtin.shell: wg pubkey < "{{ wg_state_dir }}/private.key" > "{{ wg_state_dir }}/public.key"
      args:
        creates: "{{ wg_state_dir }}/public.key"
      no_log: true

- name: Create retained WireGuard identities on every server
  hosts: managed
  become: true
  tasks:
    - name: Install WireGuard
      ansible.builtin.apt:
        name: wireguard-tools
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Create WireGuard directory
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        mode: "0700"
    - name: Generate retained server private key
      ansible.builtin.shell: |
        set -o pipefail
        umask 077
        wg genkey > /etc/wireguard/private.key
      args:
        executable: /bin/bash
        creates: /etc/wireguard/private.key
      no_log: true
    - name: Derive server public key
      ansible.builtin.shell: wg pubkey < /etc/wireguard/private.key
      register: wg_public_key
      changed_when: false
    - name: Read server private key for its own configuration
      ansible.builtin.slurp:
        src: /etc/wireguard/private.key
      register: wg_private_key
      no_log: true

- name: Configure the server WireGuard mesh
  hosts: managed
  become: true
  vars:
    local_public_key: "{{ lookup('file', lookup('env', 'HOME') + '/.local/state/clickhouse/clickhouse-fixture/public.key') }}"
  tasks:
    - name: Write server WireGuard configuration
      ansible.builtin.copy:
        dest: /etc/wireguard/wg-clickhouse.conf
        mode: "0600"
        content: |
          [Interface]
          Address = {{ vpn_ip }}/24
          ListenPort = 51820
          PrivateKey = {{ wg_private_key.content | b64decode | trim }}

          [Peer]
          PublicKey = {{ local_public_key }}
          AllowedIPs = 10.21.0.254/32
          PersistentKeepalive = 25
          {% if server_role == 'clickhouse' %}

          [Peer]
          PublicKey = {{ hostvars[groups['metabase'][0]].wg_public_key.stdout }}
          AllowedIPs = 10.21.0.10/32
          Endpoint = {{ hostvars[groups['metabase'][0]].private_ip }}:51820
          PersistentKeepalive = 25
          {% else %}
          {% for host in groups['clickhouse'] %}

          [Peer]
          PublicKey = {{ hostvars[host].wg_public_key.stdout }}
          AllowedIPs = {{ hostvars[host].vpn_ip }}/32
          Endpoint = {{ hostvars[host].private_ip }}:51820
          PersistentKeepalive = 25
          {% endfor %}
          {% endif %}
      no_log: true
      notify: Restart server WireGuard
    - name: Enable server WireGuard
      ansible.builtin.systemd_service:
        name: wg-quick@wg-clickhouse
        enabled: true
        state: started
  handlers:
    - name: Restart server WireGuard
      ansible.builtin.systemd_service:
        name: wg-quick@wg-clickhouse
        state: restarted

- name: Install and configure the ClickHouse cluster
  hosts: clickhouse
  become: true
  tasks:
    - name: Install repository prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg]
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Install ClickHouse signing key
      ansible.builtin.get_url:
        url: https://packages.clickhouse.com/rpm/lts/repodata/repomd.xml.key
        dest: /usr/share/keyrings/clickhouse.asc
        mode: "0644"
    - name: Configure ClickHouse apt repository
      ansible.builtin.deb822_repository:
        name: clickhouse
        types: [deb]
        uris: https://packages.clickhouse.com/deb
        suites: [stable]
        components: [main]
        signed_by: /usr/share/keyrings/clickhouse.asc
        state: present
    - name: Install the exact ClickHouse packages
      ansible.builtin.apt:
        name:
          - "clickhouse-common-static=26.3.17.56"
          - "clickhouse-client=26.3.17.56"
          - "clickhouse-server=26.3.17.56"
        state: present
        update_cache: true
      environment:
        DEBIAN_FRONTEND: noninteractive
    - name: Install cluster configuration
      ansible.builtin.template:
        src: "{{ playbook_dir }}/clickhouse-config.xml"
        dest: /etc/clickhouse-server/config.d/colors-cluster.xml
        owner: clickhouse
        group: clickhouse
        mode: "0600"
      no_log: true
      notify: Restart ClickHouse
    - name: Install ClickHouse users
      ansible.builtin.template:
        src: "{{ playbook_dir }}/clickhouse-users.xml"
        dest: /etc/clickhouse-server/users.d/colors-users.xml
        owner: clickhouse
        group: clickhouse
        mode: "0600"
      no_log: true
      notify: Restart ClickHouse
    - name: Apply ClickHouse changes now
      ansible.builtin.meta: flush_handlers
    - name: Ensure ClickHouse is enabled and running
      ansible.builtin.systemd_service:
        name: clickhouse-server
        enabled: true
        state: started
    - name: Wait for local ClickHouse health
      ansible.builtin.uri:
        url: "http://127.0.0.1:8123/ping"
        return_content: true
      register: clickhouse_ping
      retries: 30
      delay: 2
      until: clickhouse_ping.status == 200
  handlers:
    - name: Restart ClickHouse
      ansible.builtin.systemd_service:
        name: clickhouse-server
        state: restarted

- name: Verify ClickHouse and Keeper quorum
  hosts: "{{ groups['clickhouse'][0] }}"
  become: true
  tasks:
    - name: Wait for all replicas through the cluster table
      ansible.builtin.command:
        argv:
          - clickhouse-client
          - --user
          - admin
          - --password
          - "{{ lookup('env','COLORS_PAR_CLICKHOUSE_ADMIN_PASSWORD') }}"
          - --query
          - "SELECT count() FROM clusterAllReplicas('fixture', system.one)"
      register: replica_count
      changed_when: false
      no_log: true
      retries: 30
      delay: 3
      until: replica_count.stdout | trim == '3'

- name: Install Metabase and its metadata database
  hosts: metabase
  become: true
  tasks:
    - name: Install Docker Compose
      ansible.builtin.apt:
        name: [docker.io, docker-compose-v2]
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Enable Docker
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started
    - name: Create Metabase directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop: [/etc/metabase, /var/lib/metabase/postgres]
    - name: Install Compose definition
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/docker-compose.yml"
        dest: /etc/metabase/docker-compose.yml
        mode: "0644"
    - name: Write Metabase secrets
      ansible.builtin.copy:
        dest: /etc/metabase/.env
        mode: "0600"
        content: |
          METABASE_DB_PASSWORD={{ lookup('env','COLORS_PAR_METABASE_DB_PASSWORD') }}
          METABASE_ENCRYPTION_SECRET_KEY={{ lookup('env','COLORS_PAR_METABASE_ENCRYPTION_SECRET_KEY') }}
      no_log: true
      notify: Restart Metabase
    - name: Start Metabase stack
      ansible.builtin.command: docker compose up -d
      args:
        chdir: /etc/metabase
      register: compose_up
      changed_when: "'Started' in compose_up.stdout or 'Created' in compose_up.stdout"
    - name: Apply Metabase secret changes before probing it
      ansible.builtin.meta: flush_handlers
    - name: Wait for Metabase API
      ansible.builtin.uri:
        url: "http://10.21.0.10:3000/api/session/properties"
        return_content: true
      register: metabase_properties
      retries: 60
      delay: 5
      until: metabase_properties.status == 200
    - name: Initialize Metabase and register ClickHouse
      ansible.builtin.uri:
        url: "http://10.21.0.10:3000/api/setup"
        method: POST
        body_format: json
        status_code: [200, 201]
        body:
          token: "{{ metabase_properties.json['setup-token'] }}"
          user:
            first_name: Colors
            last_name: Admin
            email: "{{ lookup('env','COLORS_PAR_METABASE_ADMIN_EMAIL') }}"
            password: "{{ lookup('env','COLORS_PAR_METABASE_ADMIN_PASSWORD') }}"
          prefs:
            site_name: ClickHouse
            site_locale: en
            allow_tracking: false
      when: metabase_properties.json['setup-token'] is not none
      no_log: true
  handlers:
    - name: Restart Metabase
      ansible.builtin.command: docker compose up -d --force-recreate
      args:
        chdir: /etc/metabase

- name: Connect the workstation to every server
  hosts: local
  gather_facts: false
  become: true
  vars:
    wg_state_dir: "{{ lookup('env', 'HOME') }}/.local/state/clickhouse/clickhouse-fixture"
  tasks:
    - name: Read retained local private key
      ansible.builtin.slurp:
        src: "{{ wg_state_dir }}/private.key"
      register: local_wg_private
      become: false
      no_log: true
    - name: Create local WireGuard directory
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        mode: "0700"
    - name: Write local WireGuard configuration
      ansible.builtin.copy:
        dest: /etc/wireguard/wg-clickhouse.conf
        mode: "0600"
        content: |
          [Interface]
          Address = 10.21.0.254/32
          PrivateKey = {{ local_wg_private.content | b64decode | trim }}
          {% for host in groups['managed'] %}

          [Peer]
          PublicKey = {{ hostvars[host].wg_public_key.stdout }}
          AllowedIPs = {{ hostvars[host].vpn_ip }}/32
          Endpoint = {{ hostvars[host].ansible_host }}:51820
          PersistentKeepalive = 25
          {% endfor %}
      no_log: true
    - name: Reconnect managed WireGuard interface
      ansible.builtin.shell: |
        wg-quick down wg-clickhouse 2>/dev/null || true
        wg-quick up wg-clickhouse
      args:
        executable: /bin/bash
      environment:
        PATH: "{{ lookup('env','PATH') }}"
      changed_when: true
    - name: Verify every VPN address
      ansible.builtin.command: "ping -c 1 -W 3 {{ hostvars[item].vpn_ip }}"
      loop: "{{ groups['managed'] }}"
      changed_when: false
