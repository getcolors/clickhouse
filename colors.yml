# Example only. See the first consumer's complete colors.yml.
profile: clickhouse-example
workdir: .colors
provider-compute: hcloud
provider-dns: cloudflare
provider-backend: local
compute-prevent-destroy: true
domain: example.com
clickhouse-cluster-name: clickhouse-example
clickhouse-version: 26.3.17.56
clickhouse-shards: 1
clickhouse-replicas: 3
clickhouse-keeper-nodes: 3
clickhouse-http-port: 8123
clickhouse-native-port: 9000
clickhouse-metabase-user: metabase
clickhouse-dbt-user: dbt
metabase-image: metabase/metabase:v0.63.2
metabase-postgres-image: postgres:16.14
metabase-port: 3000
dbt-core-version: 1.11.12
dbt-clickhouse-version: 1.10.1
dbt-project-dir: dbt
hcloud-name: clickhouse-example
hcloud-image: ubuntu-24.04
hcloud-server-type: cx33
metabase-hcloud-server-type: cx23
hcloud-location: nbg1
hcloud-ssh-keys: REPLACE_ME
hcloud-network-zone: eu-central
hcloud-network-cidr: 10.20.0.0/16
hcloud-subnet-cidr: 10.20.1.0/24
wireguard-port: 51820
wireguard-network-cidr: 10.21.0.0/24
wireguard-client-address: 10.21.0.254/32
