- name: Install and configure the ClickHouse cluster
  hosts: clickhouse
  become: true
  tasks:
    - name: Refuse empty ClickHouse secrets
      ansible.builtin.assert:
        that:
          - lookup('env', 'COLORS_PAR_CLICKHOUSE_ADMIN_PASSWORD') | length > 0
          - lookup('env', 'COLORS_PAR_CLICKHOUSE_INTERSERVER_SECRET') | length > 0
          - lookup('env', 'COLORS_PAR_CLICKHOUSE_METABASE_PASSWORD') | length > 0
          - lookup('env', 'COLORS_PAR_CLICKHOUSE_DBT_PASSWORD') | length > 0
      no_log: true
    - name: Install repository prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg]
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Install ClickHouse signing key
      ansible.builtin.get_url:
        url: https://packages.clickhouse.com/rpm/lts/repodata/repomd.xml.key
        dest: /usr/share/keyrings/clickhouse.asc
        mode: "0644"
    - name: Configure ClickHouse apt repository
      ansible.builtin.deb822_repository:
        name: clickhouse
        types: [deb]
        uris: https://packages.clickhouse.com/deb
        suites: [stable]
        components: [main]
        signed_by: /usr/share/keyrings/clickhouse.asc
        state: present
    - name: Install the exact ClickHouse packages
      ansible.builtin.apt:
        name:
          - "clickhouse-common-static=26.3.29.7"
          - "clickhouse-client=26.3.29.7"
          - "clickhouse-server=26.3.29.7"
        state: present
        update_cache: true
      environment:
        DEBIAN_FRONTEND: noninteractive
    - name: Install cluster configuration
      ansible.builtin.template:
        src: "{{ playbook_dir }}/clickhouse-config.xml"
        dest: /etc/clickhouse-server/config.d/colors-cluster.xml
        owner: clickhouse
        group: clickhouse
        mode: "0600"
      no_log: true
      notify: Restart ClickHouse
    - name: Install ClickHouse users
      ansible.builtin.template:
        src: "{{ playbook_dir }}/clickhouse-users.xml"
        dest: /etc/clickhouse-server/users.d/colors-users.xml
        owner: clickhouse
        group: clickhouse
        mode: "0600"
      no_log: true
      notify: Restart ClickHouse
    - name: Install authenticated local operator client
      ansible.builtin.copy:
        content: "<config><user>admin</user><password>{{ lookup('env', 'COLORS_PAR_CLICKHOUSE_ADMIN_PASSWORD') | e }}</password></config>"
        dest: /etc/clickhouse-server/backup-client.xml
        mode: '0600'
      no_log: true
    - name: Install ClickHouse health monitor
      ansible.builtin.copy:
        src: clickhouse-monitor.py
        dest: /usr/local/sbin/clickhouse-monitor
        mode: '0700'
    - name: Install monitor service
      ansible.builtin.copy:
        dest: /etc/systemd/system/clickhouse-monitor.service
        mode: '0644'
        content: |
          [Unit]
          Description=ClickHouse measurable cluster health
          After=clickhouse-server.service
          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/clickhouse-monitor
          TimeoutStartSec=5min
    - name: Install monitor timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/clickhouse-monitor.timer
        mode: '0644'
        content: |
          [Unit]
          Description=Check ClickHouse health every fifteen minutes
          [Timer]
          OnBootSec=15min
          OnUnitActiveSec=15min
          [Install]
          WantedBy=timers.target
    - name: Enable monitor timer
      ansible.builtin.systemd_service:
        name: clickhouse-monitor.timer
        daemon_reload: true
        enabled: true
        state: started
    - name: Apply ClickHouse changes now
      ansible.builtin.meta: flush_handlers
    - name: Ensure ClickHouse is enabled and running
      ansible.builtin.systemd_service:
        name: clickhouse-server
        enabled: true
        state: started
    - name: Wait for local ClickHouse health
      ansible.builtin.uri:
        url: "http://127.0.0.1:8123/ping"
        return_content: true
      register: clickhouse_ping
      retries: 30
      delay: 2
      until: clickhouse_ping.status == 200
  handlers:
    - name: Restart ClickHouse
      ansible.builtin.systemd_service:
        name: clickhouse-server
        state: restarted

- name: Verify ClickHouse and Keeper quorum
  hosts: clickhouse
  become: true
  tasks:
    - name: Wait for all replicas through the cluster table
      ansible.builtin.command:
        argv:
          - clickhouse-client
          - --user
          - admin
          - --password
          - "{{ lookup('env','COLORS_PAR_CLICKHOUSE_ADMIN_PASSWORD') }}"
          - --query
          - "SELECT count() FROM clusterAllReplicas('clickhouse-aws', system.one)"
      register: replica_count
      changed_when: false
      no_log: true
      retries: 30
      delay: 3
      until: replica_count.stdout | trim == '3'
    - name: Verify Keeper quorum and UTC
      ansible.builtin.command:
        argv: [clickhouse-client, --user, admin, --password, "{{ lookup('env', 'COLORS_PAR_CLICKHOUSE_ADMIN_PASSWORD') }}", --query, "SELECT (SELECT count() FROM system.zookeeper WHERE path = '/') > 0 AND timezone() = 'UTC'"]
      register: keeper_health
      retries: 10
      delay: 3
      until: keeper_health.stdout | trim == '1'
      changed_when: false
      no_log: true
    - name: Flush lazily created system logs
      ansible.builtin.command:
        argv: [clickhouse-client, --user, admin, --password, "{{ lookup('env', 'COLORS_PAR_CLICKHOUSE_ADMIN_PASSWORD') }}", --query, "SYSTEM FLUSH LOGS"]
      changed_when: false
      no_log: true

- import_playbook: clickhouse-backup.yml
